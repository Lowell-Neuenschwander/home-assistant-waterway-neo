# Replace waterway_neo with your actual climate entity ID before importing.
input_boolean:
  hot_tub_boost_active:
    name: Hot Tub Boost Active

input_datetime:
  hot_tub_boost_end:
    name: Hot Tub Boost End
    has_date: true
    has_time: true

automation:
  - alias: Hot Tub - Detect Target Above 99°F
    id: waterway_neo_detect_104_boost
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: climate.waterway_neo
        attribute: temperature
        above: 99
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.waterway_neo_cloud_connection
        to: "on"
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: numeric_state
        entity_id: climate.waterway_neo
        attribute: temperature
        above: 99
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hot_tub_boost_active
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hot_tub_boost_end
        data:
          datetime: "{{ (now() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S') }}"

  - alias: Hot Tub - Reconcile 99°F Setback After Elevated Target
    id: waterway_neo_reconcile_setback
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hot_tub_boost_end
        id: deadline
      - trigger: time_pattern
        minutes: "/5"
        id: watchdog
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id: binary_sensor.waterway_neo_cloud_connection
        to: "on"
        id: recovered
    conditions:
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "on"
      - condition: template
        value_template: >-
          {% set deadline = as_timestamp(states('input_datetime.hot_tub_boost_end'), 0) %}
          {{ deadline > 0 and deadline <= as_timestamp(now()) }}
    actions:
      - repeat:
          count: 3
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ state_attr('climate.waterway_neo', 'temperature') | float(200) > 99 }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: climate.waterway_neo
                  data:
                    temperature: 99
                - delay: "00:00:15"
                - action: homeassistant.update_entity
                  target:
                    entity_id: climate.waterway_neo
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ state_attr('climate.waterway_neo', 'temperature') | float(200) <= 99 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hot_tub_boost_active
              - action: persistent_notification.dismiss
                data:
                  notification_id: waterway_neo_setback_failed
        default:
          - action: persistent_notification.create
            data:
              notification_id: waterway_neo_setback_failed
              title: Hot Tub Setback Failed
              message: >-
                Home Assistant could not verify a target at or below 99°F after
                three attempts. The safeguard remains active and the watchdog will retry.

  - alias: Hot Tub - Complete Safeguard When Already at Setback
    id: waterway_neo_complete_safe_setback
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: climate.waterway_neo
        attribute: temperature
        below: 99.5
    conditions:
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hot_tub_boost_active
      - action: persistent_notification.dismiss
        data:
          notification_id: waterway_neo_setback_failed

  - alias: Hot Tub - High Temperature Warning
    id: waterway_neo_high_temperature_warning
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        to: "on"
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: waterway_neo_high_temperature_warning
          title: Hot Tub High Temperature Warning
          message: >-
            Measured water temperature is
            {{ states('sensor.waterway_neo_water_temperature') }}°F. Do not enter
            the spa. Verify with an independent thermometer and shut down or
            service the heater if the reading is confirmed.
      # Add your mobile or voice notify action here.

  - alias: Hot Tub - Freeze Risk Warning
    id: waterway_neo_freeze_risk_warning
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        to: "on"
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: waterway_neo_freeze_risk_warning
          title: Hot Tub Freeze-Risk Warning
          message: >-
            Measured water temperature is
            {{ states('sensor.waterway_neo_water_temperature') }}°F. Inspect the
            heater, circulation, and power promptly to protect the plumbing.
      # Add your mobile or voice notify action here.

  - alias: Hot Tub - Clear Temperature Warnings
    id: waterway_neo_clear_temperature_warnings
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        to: "off"
        id: high
      - trigger: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        to: "off"
        id: freeze
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: >-
            {{ 'waterway_neo_high_temperature_warning'
               if trigger.id == 'high'
               else 'waterway_neo_freeze_risk_warning' }}
