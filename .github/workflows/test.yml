name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Unit tests
        run: pytest
