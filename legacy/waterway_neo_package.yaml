# Legacy package. The HACS custom integration is the recommended installation.
command_line:
  - sensor:
      name: Waterway NEO Controller
      unique_id: waterway_neo_controller
      command: python3 /config/waterway_neo.py status
      scan_interval: 300
      command_timeout: 15
      value_template: "{{ value_json.status }}"
      json_attributes:
        - water_temperature
        - target_temperature
        - controller_time
        - clock_drift_minutes
        - local_available
        - cloud_available
        - raw_status
        - other_status
        - local_error
        - cloud_error
        - error

shell_command:
  waterway_neo_set_temperature: >-
    python3 /config/waterway_neo.py set {{ temperature | int }}
  waterway_neo_sync_time: python3 /config/waterway_neo.py sync-time

template:
  - binary_sensor:
      - name: Waterway NEO Controller Online
        unique_id: waterway_neo_controller_online
        device_class: connectivity
        state: "{{ is_state('sensor.waterway_neo_controller', 'online') }}"
      - name: Waterway NEO Cloud Available
        unique_id: waterway_neo_cloud_available
        device_class: connectivity
        state: >-
          {{ state_attr('sensor.waterway_neo_controller', 'cloud_available') | bool(false) }}
      - name: Waterway NEO Clock Synchronized
        unique_id: waterway_neo_clock_synchronized
        icon: mdi:clock-check-outline
        availability: >-
          {{ is_state('binary_sensor.waterway_neo_cloud_available', 'on') and
             state_attr('sensor.waterway_neo_controller', 'clock_drift_minutes') is not none }}
        state: >-
          {{ state_attr('sensor.waterway_neo_controller', 'clock_drift_minutes')
             | float(9999) | abs <= 5 }}
      - name: Waterway NEO High Temperature Warning
        unique_id: waterway_neo_high_temperature_warning
        device_class: problem
        icon: mdi:thermometer-alert
        availability: >-
          {{ is_state('sensor.waterway_neo_controller', 'online') and
             state_attr('sensor.waterway_neo_controller', 'water_temperature') is not none }}
        state: >-
          {{ state_attr('sensor.waterway_neo_controller', 'water_temperature')
             | float(0) >= 110 }}
      - name: Waterway NEO Freeze Risk Warning
        unique_id: waterway_neo_freeze_risk_warning
        device_class: problem
        icon: mdi:snowflake-alert
        availability: >-
          {{ is_state('sensor.waterway_neo_controller', 'online') and
             state_attr('sensor.waterway_neo_controller', 'water_temperature') is not none }}
        state: >-
          {{ state_attr('sensor.waterway_neo_controller', 'water_temperature')
             | float(999) <= 60 }}
    sensor:
      - name: Waterway NEO Water Temperature
        unique_id: waterway_neo_water_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °F
        availability: >-
          {{ is_state('binary_sensor.waterway_neo_controller_online', 'on') }}
        state: "{{ state_attr('sensor.waterway_neo_controller', 'water_temperature') }}"
      - name: Waterway NEO Target Temperature
        unique_id: waterway_neo_target_temperature
        device_class: temperature
        unit_of_measurement: °F
        availability: >-
          {{ is_state('binary_sensor.waterway_neo_cloud_available', 'on') and
             state_attr('sensor.waterway_neo_controller', 'target_temperature') is not none }}
        state: "{{ state_attr('sensor.waterway_neo_controller', 'target_temperature') }}"
      - name: Waterway NEO Controller Time
        unique_id: waterway_neo_controller_time
        device_class: timestamp
        availability: >-
          {{ is_state('binary_sensor.waterway_neo_cloud_available', 'on') and
             state_attr('sensor.waterway_neo_controller', 'controller_time') is not none }}
        state: "{{ state_attr('sensor.waterway_neo_controller', 'controller_time') }}"
      - name: Waterway NEO Clock Drift
        unique_id: waterway_neo_clock_drift
        unit_of_measurement: min
        state_class: measurement
        availability: >-
          {{ is_state('binary_sensor.waterway_neo_cloud_available', 'on') and
             state_attr('sensor.waterway_neo_controller', 'clock_drift_minutes') is not none }}
        state: "{{ state_attr('sensor.waterway_neo_controller', 'clock_drift_minutes') }}"

input_boolean:
  hot_tub_boost_active:
    name: Hot Tub Boost Active
    icon: mdi:timer-fire

input_number:
  hot_tub_requested_temperature:
    name: Hot Tub Requested Temperature
    icon: mdi:thermometer-water
    min: 80
    max: 104
    step: 1
    mode: box
    unit_of_measurement: °F

input_datetime:
  hot_tub_boost_end:
    name: Hot Tub Boost End
    has_date: true
    has_time: true

script:
  hot_tub_apply_requested_temperature:
    alias: Hot Tub - Apply Requested Temperature
    mode: restart
    sequence:
      - action: shell_command.waterway_neo_set_temperature
        data:
          temperature: "{{ states('input_number.hot_tub_requested_temperature') | int }}"
      - delay: "00:00:05"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.waterway_neo_controller
  hot_tub_boost_8_hours:
    alias: Hot Tub - Boost to 104°F for 8 Hours
    mode: restart
    sequence:
      - action: shell_command.waterway_neo_set_temperature
        data:
          temperature: 104
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hot_tub_boost_active
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hot_tub_boost_end
        data:
          datetime: "{{ (now() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S') }}"
  hot_tub_setback_now:
    alias: Hot Tub - Set Back to 99°F Now
    mode: restart
    sequence:
      - action: shell_command.waterway_neo_set_temperature
        data:
          temperature: 99
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hot_tub_boost_active

automation:
  - id: waterway_neo_detect_104_boost
    alias: Hot Tub - Detect 104°F Boost
    triggers:
      - trigger: numeric_state
        entity_id: sensor.waterway_neo_target_temperature
        above: 103.5
    conditions:
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hot_tub_boost_active
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hot_tub_boost_end
        data:
          datetime: "{{ (now() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S') }}"
  - id: waterway_neo_boost_deadline
    alias: Hot Tub - Reconcile 99°F Setback After Boost
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hot_tub_boost_end
        id: deadline
      - trigger: time_pattern
        minutes: "/5"
        id: watchdog
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id: binary_sensor.waterway_neo_cloud_available
        to: "on"
        id: recovered
    conditions:
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "on"
      - condition: template
        value_template: >-
          {% set deadline = as_timestamp(states('input_datetime.hot_tub_boost_end'), 0) %}
          {{ deadline > 0 and deadline <= as_timestamp(now()) }}
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.waterway_neo_target_temperature') | float(200) > 99 }}
        then:
          - action: shell_command.waterway_neo_set_temperature
            continue_on_error: true
            data:
              temperature: 99
          - delay: "00:00:05"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.waterway_neo_controller
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: sensor.waterway_neo_target_temperature
                below: 99.5
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hot_tub_boost_active
              - action: persistent_notification.dismiss
                data:
                  notification_id: waterway_neo_setback_failed
        default:
          - action: persistent_notification.create
            data:
              notification_id: waterway_neo_setback_failed
              title: Hot Tub Setback Failed
              message: >-
                Home Assistant could not verify a target at or below 99°F. The
                boost remains active and the five-minute watchdog will retry.
  - id: waterway_neo_complete_safe_setback
    alias: Hot Tub - Complete Boost When Already at Setback
    triggers:
      - trigger: numeric_state
        entity_id: sensor.waterway_neo_target_temperature
        below: 99.5
    conditions:
      - condition: state
        entity_id: input_boolean.hot_tub_boost_active
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hot_tub_boost_active
      - action: persistent_notification.dismiss
        data:
          notification_id: waterway_neo_setback_failed
  - id: waterway_neo_clock_sync
    alias: Hot Tub - Synchronize Controller Clock
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_clock_synchronized
        to: "off"
        for: "00:10:00"
      - trigger: time_pattern
        hours: /6
        minutes: "17"
    conditions:
      - condition: state
        entity_id: binary_sensor.waterway_neo_controller_online
        state: "on"
      - condition: state
        entity_id: binary_sensor.waterway_neo_clock_synchronized
        state: "off"
    actions:
      - action: shell_command.waterway_neo_sync_time
      - delay: "00:00:05"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.waterway_neo_controller
  - id: waterway_neo_high_temperature_warning
    alias: Hot Tub - High Temperature Warning
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        to: "on"
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: waterway_neo_high_temperature_warning
          title: Hot Tub High Temperature Warning
          message: >-
            Measured water temperature is
            {{ states('sensor.waterway_neo_water_temperature') }}°F. Do not enter
            the spa. Verify with an independent thermometer and shut down or
            service the heater if confirmed.
  - id: waterway_neo_freeze_risk_warning
    alias: Hot Tub - Freeze Risk Warning
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        to: "on"
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: waterway_neo_freeze_risk_warning
          title: Hot Tub Freeze-Risk Warning
          message: >-
            Measured water temperature is
            {{ states('sensor.waterway_neo_water_temperature') }}°F. Inspect the
            heater, circulation, and power promptly to protect the plumbing.
  - id: waterway_neo_clear_temperature_warnings
    alias: Hot Tub - Clear Temperature Warnings
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.waterway_neo_high_temperature_warning
        to: "off"
        id: high
      - trigger: state
        entity_id: binary_sensor.waterway_neo_freeze_risk_warning
        to: "off"
        id: freeze
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: >-
            {{ 'waterway_neo_high_temperature_warning'
               if trigger.id == 'high'
               else 'waterway_neo_freeze_risk_warning' }}
